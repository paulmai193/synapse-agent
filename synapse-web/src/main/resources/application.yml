spring:
  application:
    name: synapse-agent
  profiles:
    active: dev
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        max-wait: 2000ms
      shutdown-timeout: 100ms
  
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse_db
    username: synapse_user
    password: synapse_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      # Performance optimization settings
      auto-commit: false
      connection-test-query: SELECT 1
      validation-timeout: 5000

  data:
    mongodb:
      uri: mongodb://localhost:27017/synapse_docs
      # MongoDB connection pooling optimization
      options:
        max-connection-pool-size: 50
        min-connection-pool-size: 5
        max-connection-idle-time: 300000
        max-connection-life-time: 1200000
        connect-timeout: 10000
        socket-timeout: 30000
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET:synapse-jwt-secret-key-change-in-production}
      expiration: 86400000 # 24 hours

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.synapse: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/synapse-agent.log

synapse:
  nlp:
    service:
      url: http://localhost:8001
  vector:
    database:
      url: http://localhost:6333
      collection-name: synapse_embeddings
      vector-size: 384
  llm:
    ollama:
      url: http://localhost:11434
      model: llama3.1:8b
      timeout: 30000 # 30 seconds
      max-tokens: 2048
      temperature: 0.7
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        sliding-window-size: 10
      retry:
        max-attempts: 3
        wait-duration: 1000
      rate-limiter:
        limit-for-period: 10
        limit-refresh-period: 60000
  document:
    upload:
      max-file-size: 100MB
      allowed-types: pdf,docx,txt,md
  cache:
    ttl:
      user-permissions: 3600 # 1 hour
      search-results: 1800 # 30 minutes
      embeddings: 86400 # 24 hours

---
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    com.synapse: DEBUG
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/synapse_test
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.synapse: WARN
    org.springframework: WARN