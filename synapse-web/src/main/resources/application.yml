spring:
  application:
    name: synapse-agent
  profiles:
    active: dev
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        max-wait: 2000ms
      shutdown-timeout: 100ms
  
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse_db
    username: synapse_user
    password: synapse_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 8
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      # Performance optimization settings
      auto-commit: false
      connection-test-query: SELECT 1
      validation-timeout: 5000
      # Additional optimization settings
      cache-prep-stmts: true
      prep-stmt-cache-size: 250
      prep-stmt-cache-sql-limit: 2048
      use-server-prep-stmts: true
      register-mbeans: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/synapse_docs
      # MongoDB connection pooling optimization
      options:
        max-connection-pool-size: 60
        min-connection-pool-size: 8
        max-connection-idle-time: 300000
        max-connection-life-time: 1200000
        connect-timeout: 10000
        socket-timeout: 30000
        # Additional MongoDB optimization
        max-wait-time: 10000
        server-selection-timeout: 5000
        heartbeat-frequency: 10000
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 100ms
        # Connection optimization
        cluster:
          refresh:
            adaptive: true
            period: 30s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET:synapse-jwt-secret-key-change-in-production}
      expiration: 86400000 # 24 hours

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    # Performance monitoring
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      sla:
        http.server.requests: 1s,3s,5s

logging:
  level:
    com.synapse: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/synapse-agent.log

synapse:
  nlp:
    service:
      url: http://localhost:8001
      timeout: 15000 # 15 seconds
      connection-pool-size: 10
  vector:
    database:
      url: http://localhost:6333
      collection-name: synapse_embeddings
      vector-size: 384
      # HNSW optimization parameters
      hnsw:
        ef-construct: 200
        m: 16
        ef: 128
      # Search optimization
      search:
        exact: false
        rescore: true
  llm:
    ollama:
      url: http://localhost:11434
      model: llama3.1:8b
      timeout: 30000 # 30 seconds
      max-tokens: 2048
      temperature: 0.7
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        sliding-window-size: 10
      retry:
        max-attempts: 3
        wait-duration: 1000
      rate-limiter:
        limit-for-period: 10
        limit-refresh-period: 60000
  document:
    upload:
      max-file-size: 100MB
      allowed-types: pdf,docx,txt,md
      # Processing optimization
      batch-size: 10
      parallel-processing: true
  search:
    max-results: 100
    relevance-threshold: 0.5
    # Performance targets
    response-time-target: 3000 # 3 seconds
    cache-warm-queries: 50
  cache:
    ttl:
      user-permissions: 3600 # 1 hour
      search-results: 1800 # 30 minutes
      embeddings: 86400 # 24 hours
      user-access: 3600 # 1 hour
      query-results: 900 # 15 minutes
    # Cache optimization
    max-size: 10000
    eviction-policy: LRU

---
spring:
  config:
    activate:
      on-profile: dev
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    com.synapse: DEBUG
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/synapse_test
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.synapse: WARN
    org.springframework: WARN