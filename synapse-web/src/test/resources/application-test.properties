# Test configuration for integration tests
# Task 14.1: Create comprehensive integration test suite

# Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# MongoDB test configuration
spring.data.mongodb.uri=mongodb://localhost:27017/synapse_test

# Redis test configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1

# Disable external services for tests
synapse.nlp.service.url=http://localhost:8001
synapse.vector.database.url=http://localhost:6333
synapse.llm.ollama.url=http://localhost:11434

# Test-specific settings
logging.level.com.synapse=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT settings for tests
spring.security.jwt.secret=test-jwt-secret-key-for-testing-only
spring.security.jwt.expiration=3600000

# Disable async processing in tests
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1