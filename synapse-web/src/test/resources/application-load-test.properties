# Load Test Configuration
spring.profiles.active=load-test

# Database Configuration for Load Testing
spring.datasource.url=jdbc:h2:mem:loadtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# MongoDB Configuration for Load Testing
spring.data.mongodb.uri=mongodb://localhost:27017/synapse_load_test

# Redis Configuration for Load Testing
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=1

# Vector Database Configuration for Load Testing
qdrant.host=localhost
qdrant.port=6333
qdrant.collection-name=synapse_load_test

# NLP Service Configuration for Load Testing
nlp.service.url=http://localhost:8001
nlp.service.timeout=10000

# Performance Testing Settings
load-test.concurrent-users=100
load-test.requests-per-user=10
load-test.max-response-time=3000
load-test.min-success-rate=95

# Logging Configuration
logging.level.com.synapse=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n