input {
  beats {
    port => 5044
  }
  
  # Docker logs
  gelf {
    port => 12201
  }
}

filter {
  # Parse Spring Boot logs
  if [fields][service] == "synapse-backend" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:thread} %{DATA:logger} - %{GREEDYDATA:log_message}" }
    }
    
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }
  
  # Parse NLP service logs
  if [fields][service] == "synapse-nlp" {
    json {
      source => "message"
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:dev}" }
    add_field => { "application" => "synapse" }
  }
  
  # Parse error logs
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Parse security events
  if [log_message] =~ /authentication|authorization|login|logout/ {
    mutate {
      add_tag => [ "security" ]
    }
  }
  
  # Parse performance metrics
  if [log_message] =~ /duration|response_time|latency/ {
    grok {
      match => { "log_message" => "duration=(?<duration>\d+)" }
    }
    
    if [duration] {
      mutate {
        convert => { "duration" => "integer" }
        add_tag => [ "performance" ]
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "synapse-logs-%{+YYYY.MM.dd}"
  }
  
  # Output errors to separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "synapse-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Output security events to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "synapse-security-%{+YYYY.MM.dd}"
    }
  }
  
  stdout { codec => rubydebug }
}